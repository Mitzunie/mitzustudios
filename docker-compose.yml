# ─── MitzuStudios Portfolio — Dev Services ───
# PostgreSQL + Redis para desarrollo local.
# La app Next.js corre con `pnpm dev` desde el host.
# Uso: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mitzustudios-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mitzustudios
      POSTGRES_PASSWORD: mitzustudios_dev
      POSTGRES_DB: mitzustudios_portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitzustudios"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mitzustudios-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:
