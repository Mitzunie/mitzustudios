name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://test:test@localhost:5432/test
  AUTH_SECRET: test-secret-at-least-32-chars-long-for-ci
  ADMIN_EMAILS: admin@mitzustudios.test
  RESEND_API_KEY: re_test_dummy
  NOTIFICATION_EMAIL: test@mitzustudios.test
  CLOUDINARY_CLOUD_NAME: test
  CLOUDINARY_API_KEY: '000000'
  CLOUDINARY_API_SECRET: test-secret
  WHATSAPP_PYME_NUMBER: '56900000000'
  NEXT_PUBLIC_CONTACT_EMAIL: test@mitzustudios.test
  NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
  RATE_LIMIT_MAX: '9999'
  RATE_LIMIT_WINDOW_MS: '60000'
  NODE_ENV: test

jobs:
  test:
    name: Validate (lint + typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push DB schema
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: apps/web/coverage/

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci
      - name: Run npm audit
        working-directory: ./apps/web
        run: npm audit --audit-level high
        continue-on-error: true
